dependency:
  name: galaxy
  enabled: false
driver:
  name: containers
platforms:
  - name: oauth2_proxy_el10
    image: docker.io/library/almalinux:10
    pre_build_image: false
    command: /sbin/init
    # Systemd requires either tmpfs mounts or privileged mode
    privileged: true
    # Molecule expects the tmpfs configuration to be a list, but Podman only accepts a dictionary
    # tmpfs:
    #   "/tmp": "exec"
    #   "/run": "rw,noexec,nosuid,nodev"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
  - name: oauth2_proxy_debian
    image: docker.io/library/debian:latest
    pre_build_image: false
    command: /sbin/init
    # Systemd requires either tmpfs mounts or privileged mode
    privileged: true
    # Molecule expects the tmpfs configuration to be a list, but Podman only accepts a dictionary
    # tmpfs:
    #   "/tmp": "exec"
    #   "/run": "rw,noexec,nosuid,nodev"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
  - name: oauth2_proxy_ubuntu
    image: docker.io/library/ubuntu:latest
    pre_build_image: false
    command: /sbin/init
    # Systemd requires either tmpfs mounts or privileged mode
    privileged: true
    # Molecule expects the tmpfs configuration to be a list, but Podman only accepts a dictionary
    # tmpfs:
    #   "/tmp": "exec"
    #   "/run": "rw,noexec,nosuid,nodev"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
lint: |
  set -e
  ansible-lint
provisioner:
  name: ansible
verifier:
  name: ansible
