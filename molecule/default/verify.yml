---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Stat oauth2-proxy binary file
      ansible.builtin.stat:
        path: /opt/oauth2-proxy/oauth2-proxy
      register: oauth2_proxy_file

    - name: Check oauth2-proxy binary file exists and executable
      ansible.builtin.assert:
        that:
          - oauth2_proxy_file.stat.exists
          - oauth2_proxy_file.stat.executable
        fail_msg: oauth2-proxy binary file do not exist or isn't executable
        success_msg: oauth2-proxy binary file present
        quiet: true

    - name: Gather services facts
      ansible.builtin.service_facts:

    - name: Verify oauth2-proxy service state
      ansible.builtin.assert:
        that:
          - oauth2_proxy_service_name in ansible_facts['services']
          - ansible_facts['services'][oauth2_proxy_service_name]['status'] | default('not-found') == 'active'
          - ansible_facts['services'][oauth2_proxy_service_name]['state'] | default('not-found') == 'running'
        fail_msg: "{{ oauth2_proxy_service_name }} isn't enabled or running"
        success_msg: "{{ oauth2_proxy_service_name }} is enabled and running"
        quiet: true
      vars:
        oauth2_proxy_service_name: "oauth2-proxy@{{ inventory_hostname }}.service"

    - name: Test default TCP port is open
      ansible.builtin.wait_for:
        port: 4180
        timeout: 5
        msg: oauth2-proxy TCP port not open, the service is not ready

    - name: Verify oauth2-proxy service state for the second instance
      ansible.builtin.assert:
        that:
          - oauth2_proxy_service_name in ansible_facts['services']
          - ansible_facts['services'][oauth2_proxy_service_name]['status'] | default('not-found') == 'active'
          - ansible_facts['services'][oauth2_proxy_service_name]['state'] | default('not-found') == 'running'
        fail_msg: "{{ oauth2_proxy_service_name }} isn't enabled or running"
        success_msg: "{{ oauth2_proxy_service_name }} is enabled and running"
        quiet: true
      vars:
        oauth2_proxy_service_name: "oauth2-proxy@myotherapp.edu.org.service"

    - name: Test custom TCP port 4181 is open
      ansible.builtin.wait_for:
        port: 4181
        timeout: 5
        msg: oauth2-proxy custom TCP port 4181 not open, the service is not ready
