- name: Read configuration directory content
  ansible.builtin.find:
    paths: /etc/oauth2-proxy
    file_type: file
    patterns: "*.cfg"
  register: oauth2_proxy_configs

- name: Stop oauth2-proxy service for specific domain
  ansible.builtin.systemd:
    name: "oauth2-proxy@{{ item | ansible.builtin.regex_replace('([^/]+)\\.cfg$', '\\1') }}.service"
    state: stopped
    enabled: false
  loop: "{{ oauth2_proxy_configs.files | default([]) }}"

- name: Remove oauth2-proxy files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /opt/oauth2-proxy/oauth2-proxy
    - /opt/oauth2-proxy/version.txt
